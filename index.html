async function callClaude(messages, system) {
  try {
    const body = { model:"claude-sonnet-4-20250514", max_tokens:2000, messages };
    if (system) body.system = system;
    const res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    if (!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    return data.content?.map(b => b.text||"").join("") || "";
  } catch(e) { console.error("Claude API error:",e); throw e; }
}

function speakText(text, onEnd) {
  if (!window.speechSynthesis) { onEnd && onEnd(); return; }
  window.speechSynthesis.cancel();
  const clean = text.replace(/[*_#`~]/g,"").replace(/
+/g," ").trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.rate=0.88; utter.pitch=1.08; utter.volume=1;
  if (onEnd) utter.onend = onEnd;
  utter.onerror = () => onEnd && onEnd();
  function trySpeak() {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      const pref = voices.find(v=>/samantha|karen|victoria|moira|zira/i.test(v.name)) || voices.find(v=>/en.US|en_US/i.test(v.lang)&&/female/i.test(v.name)) || voices.find(v=>/en.US|en_US/i.test(v.lang)) || voices[0];
      if (pref) utter.voice = pref;
      window.speechSynthesis.speak(utter);
    } else { window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.onvoiceschanged=null; trySpeak(); }; }
  }
  trySpeak();
}

function PixelCanvas({ pattern, color, size=8, animated=false }) {
  const [frame, setFrame] = useState(0);
  useEffect(() => { if (!animated) return; const id=setInterval(()=>setFrame(f=>f+1),160); return ()=>clearInterval(id); }, [animated]);
  return (
    <div style={{ display:"grid", gridTemplateColumns:`repeat(8,${size}px)`, gap:1 }}>
      {pattern.map((row,r) => row.split("").map((cell,c) => {
        const lit=cell==="1", glow=animated&&lit&&((r+c+frame)%5===0);
        return <div key={r+"-"+c} style={{ width:size, height:size, background:lit?(glow?"#fff":color):"transparent", borderRadius:1, transition:"background 0.1s", boxShadow:glow?"0 0 4px "+color:"none" }} />;
      }))}
    </div>
  );
}

useEffect(()=>{if(!slide)return;setDrawProgress(0);setSpeaking(true);clearInterval(drawRef.current);let prog=0;drawRef.current=setInterval(()=>{prog+=0.7;if(prog>=100){prog=100;clearInterval(drawRef.current);}setDrawProgress(prog);},56);clearInterval(mouthRef.current);mouthRef.current=setInterval(()=>setMouthOpen(o=>!o),200);speakText(slide.narration,()=>{setSpeaking(false);setMouthOpen(false);clearInterval(mouthRef.current);});return()=>{clearInterval(mouthRef.current);clearInterval(drawRef.current);window.speechSynthesis.cancel();};},[idx]);

function PracticeMode({topic,accentColor,unitPattern,onDone}){const[questions,setQuestions]=useState(null);const[qIdx,setQIdx]=useState(0);const[input,setInput]=useState("");const[feedback,setFeedback]=useState(null);const[checking,setChecking]=useState(false);const[score,setScore]=useState(0);
const FB={"addition":[{question:"What is 8 plus 6?",answer:"14"},{question:"What is 15 minus 7?",answer:"8"},{question:"What is 23 plus 14?",answer:"37"},{question:"What is 42 minus 18?",answer:"24"},{question:"9 plus 9 plus 4?",answer:"22"},{question:"47 apples, give away 19, how many left?",answer:"28"}],"multiplication":[{question:"6 times 7?",answer:"42"},{question:"8 times 4?",answer:"32"},{question:"9 times 3?",answer:"27"},{question:"5 times 8?",answer:"40"},{question:"7 times 7?",answer:"49"},{question:"6 boxes, 9 items each, total?",answer:"54"}],"division":[{question:"24 divided by 6?",answer:"4"},{question:"35 divided by 7?",answer:"5"},{question:"48 divided by 8?",answer:"6"},{question:"63 divided by 9?",answer:"7"},{question:"36 students, 4 groups, each group?",answer:"9"},{question:"100 divided by 5?",answer:"20"}],"intro-fractions":[{question:"Top number of a fraction?",answer:"numerator"},{question:"Bottom number of a fraction?",answer:"denominator"},{question:"Pizza cut into 4, eat 1, what fraction?",answer:"1/4"},{question:"Bigger: one half or one quarter?",answer:"one half"},{question:"Three quarters as a fraction?",answer:"3/4"},{question:"Shade 2 out of 5 parts, fraction shaded?",answer:"2/5"}],"adding-fractions":[{question:"One quarter plus two quarters?",answer:"3/4"},{question:"One third plus one third?",answer:"2/3"},{question:"Two fifths plus two fifths?",answer:"4/5"},{question:"One half plus one half?",answer:"1"},{question:"One sixth plus three sixths?",answer:"4/6"},{question:"Three eighths plus three eighths?",answer:"6/8"}],"multiplying-fractions":[{question:"One half times one half?",answer:"1/4"},{question:"Two thirds times three quarters?",answer:"1/2"},{question:"One third times one third?",answer:"1/9"},{question:"Two thirds times one half?",answer:"1/3"},{question:"Three quarters times four fifths?",answer:"3/5"},{question:"One half times two thirds?",answer:"1/3"}],"variables":[{question:"x=5, what is 2x plus 3?",answer:"13"},{question:"x=4, what is 3x minus 2?",answer:"10"},{question:"x=6, what is x plus 7?",answer:"13"},{question:"x=10, what is x divided by 2?",answer:"5"},{question:"x=3, what is x times x?",answer:"9"},{question:"x=8, what is 2x plus x?",answer:"24"}],"equations":[{question:"x plus 3 equals 7, x?",answer:"4"},{question:"2x equals 10, x?",answer:"5"},{question:"x minus 4 equals 6, x?",answer:"10"},{question:"3x equals 12, x?",answer:"4"},{question:"x plus 8 equals 15, x?",answer:"7"},{question:"2x plus 1 equals 9, x?",answer:"4"}],"shapes":[{question:"Sides of a triangle?",answer:"3"},{question:"Sides of a square?",answer:"4"},{question:"Shape with no corners?",answer:"circle"},{question:"Sides of a hexagon?",answer:"6"},{question:"Shape with 8 sides?",answer:"octagon"},{question:"Right angles in a rectangle?",answer:"4"}],"area-perimeter":[{question:"Area of rectangle, length 5, width 3?",answer:"15"},{question:"Perimeter of square, side 4?",answer:"16"},{question:"Area of rectangle, length 8, width 6?",answer:"48"},{question:"Perimeter of rectangle, length 7, width 3?",answer:"20"},{question:"Square area 25, side length?",answer:"5"},{question:"Area of triangle, base 6, height 4?",answer:"12"}],"pythagorean":[{question:"Right triangle, legs 3 and 4, hypotenuse?",answer:"5"},{question:"Right triangle, legs 5 and 12, hypotenuse?",answer:"13"},{question:"Hypotenuse 10, one leg 6, other leg?",answer:"8"},{question:"Legs 8 and 15, hypotenuse?",answer:"17"},{question:"Pythagorean theorem states?",answer:"a squared plus b squared equals c squared"},{question:"Legs 9 and 12, hypotenuse?",answer:"15"}],"matrices-intro":[{question:"Rows in a 3 by 4 matrix?",answer:"3"},{question:"Columns in a 3 by 4 matrix?",answer:"4"},{question:"Elements in a 2 by 3 matrix?",answer:"6"},{question:"Square matrix has equal rows and?",answer:"columns"},{question:"Row 1 col 1 of matrix rows 5 2 and 1 3?",answer:"5"},{question:"How to refer to row 2 col 3?",answer:"A sub 2 3"}],"matrix-operations":[{question:"Add matrices top-left 3 and 7?",answer:"10"},{question:"Can you add 2x3 to 3x2?",answer:"no"},{question:"For AxB, cols of A must equal what of B?",answer:"rows"},{question:"Row 1 2 dot column 3 4?",answer:"11"},{question:"Size of 2x3 times 3x4?",answer:"2 by 4"},{question:"Is matrix multiplication commutative?",answer:"no"}],"determinant":[{question:"Determinant of 2x2 matrix a b c d?",answer:"ad minus bc"},{question:"Determinant zero means?",answer:"the matrix has no inverse"},{question:"Determinant of matrix rows 1 2 and 3 4?",answer:"-2"},{question:"Determinant of identity matrix?",answer:"1"},{question:"Determinant of matrix rows 4 3 and 2 5?",answer:"14"},{question:"Non-zero determinant, inverse exists?",answer:"yes"}],"inverse-matrix":[{question:"A times its inverse equals?",answer:"identity matrix"},{question:"Determinant of matrix rows 2 1 and 1 1?",answer:"1"},{question:"Zero determinant, find inverse?",answer:"no"},{question:"What entries swap in 2x2 inverse?",answer:"a and d"},{question:"What happens to b and c in inverse formula?",answer:"they are negated"},{question:"Multiply all entries by?",answer:"1 over the determinant"}],"inverse-functions":[{question:"f(3)=7, f-inverse of 7?",answer:"3"},{question:"f(x)=x+3, f-inverse?",answer:"x minus 3"},{question:"f(x)=2x, f-inverse?",answer:"x over 2"},{question:"Graph of inverse reflects across?",answer:"y equals x"},{question:"First step to find inverse algebraically?",answer:"swap x and y"},{question:"Function must be what for inverse to exist?",answer:"one to one"}]};
useEffect(()=>{setQuestions(null);async function load(){try{const text=await callClaude([{role:"user",content:"Generate exactly 6 practice problems for \""+topic.title+"\". Return ONLY a JSON array: [{\"question\":\"...\",\"answer\":\"...\"}]. Answers: short text or numbers."}]);const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());if(Array.isArray(parsed)&&parsed.length>=4){setQuestions(parsed);return;}throw new Error("bad");}catch(e){setQuestions(FB[topic.id]||FB["addition"]);}}load();},[topic.id]);
async function submit(){setChecking(true);const q=questions[qIdx];const correct=input.trim().toLowerCase()===q.answer.toString().toLowerCase();let explanation;if(correct){explanation="That's right. Well done.";speakText(explanation);setFeedback({correct,explanation});}else{try{explanation=await callClaude([{role:"user",content:"Ms. Maya, math teacher. Student got wrong.
Topic: "+topic.title+"
Q: "+q.question+"
Correct: "+q.answer+"
Student: "+input+"
Explain the correct reasoning. 4-5 sentences. No markdown."}]);}catch{explanation="The correct answer is "+q.answer+". "+q.question+" — the answer is "+q.answer+".";}speakText(explanation);setFeedback({correct,explanation});}setChecking(false);if(correct)setScore(s=>s+1);}
function next(){const fs=score+(feedback?.correct?1:0);if(qIdx+1>=(questions?.length||6)){onDone(fs);return;}setQIdx(i=>i+1);setInput("");setFeedback(null);}
if(!questions)return(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><PixelCanvas pattern={unitPattern} color={accentColor} size={10} animated/><div style={{color:"#555",fontSize:13}}>Loading practice problems…</div></div>);
const q=questions[qIdx];
return(<div style={{flex:1,display:"flex",flexDirection:"column",padding:26,gap:16,overflowY:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"#444"}}>Practice · {qIdx+1}/{questions.length} · Score: {score}</div><PixelCanvas pattern={unitPattern} color={accentColor} size={6} animated/></div><div style={{background:"#111118",border:"1px solid "+accentColor+"44",borderRadius:11,padding:22}}><div style={{fontSize:18,color:"#eee",lineHeight:1.6}}>{q.question}</div><div style={{fontSize:11,color:"#444",marginTop:8}}>Type your answer and press Enter</div></div><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!feedback&&input.trim()&&!checking&&submit()} placeholder="Your answer…" autoFocus disabled={!!feedback||checking} style={{background:"#111118",border:"1px solid #2a2a3a",borderRadius:7,padding:"13px 15px",color:"#fff",fontSize:15,outline:"none"}}/>{!feedback&&(<button onClick={submit} disabled={!input.trim()||checking} style={{alignSelf:"flex-start",background:input.trim()&&!checking?accentColor:"#1a1a1a",border:"none",borderRadius:6,padding:"11px 24px",color:input.trim()&&!checking?"#fff":"#333",cursor:input.trim()&&!checking?"pointer":"default",fontSize:14,fontWeight:"bold"}}>{checking?"Checking…":"Check Answer"}</button>)}{feedback&&(<div style={{background:feedback.correct?"#0a1a0a":"#1a0a0a",border:"1px solid "+(feedback.correct?"#2a7a2a":"#7a2a2a"),borderRadius:8,padding:18}}><div style={{fontSize:11,letterSpacing:3,textTransform:"uppercase",color:feedback.correct?"#4ade4a":"#f87171",marginBottom:10}}>{feedback.correct?"✓ Correct!":"✗ Not quite"}</div><div style={{fontSize:14,color:"#ccc",lineHeight:1.75,marginBottom:14}}>{feedback.explanation}</div><button onClick={next} style={{float:"right",background:"transparent",border:"1px solid "+(feedback.correct?"#2a7a2a":"#7a2a2a"),borderRadius:5,padding:"7px 16px",color:feedback.correct?"#4ade4a":"#f87171",cursor:"pointer",fontSize:13}}>{qIdx+1>=questions.length?"Go to Quiz →":"Next Question →"}</button><div style={{clear:"both"}}/></div>)}</div>);}

function FinalQuiz({topic,unitPattern,accentColor,onBack,onComplete}){const[questions,setQuestions]=useState(null);const[answers,setAnswers]=useState({});const[submitted,setSubmitted]=useState(false);const[score,setScore]=useState(0);
useEffect(()=>{callClaude([{role:"user",content:"Create a 10-question multiple choice quiz on \""+topic.title+"\". Return ONLY a JSON array: [{\"question\":\"...\",\"answer\":\"...\",\"options\":[\"...\",\"...\",\"...\",\"...\"]}]. Answer must match one option exactly."}]).then(text=>{try{setQuestions(JSON.parse(text.replace(/```json|```/g,"").trim()));}catch{setQuestions([{question:"Key idea in "+topic.title+"?",answer:"none",options:["a","b","c","none"]}]);}});},[topic.id]);
function submit(){let s=0;questions.forEach((q,i)=>{if(answers[i]===q.answer)s++;});setScore(s);setSubmitted(true);onComplete&&onComplete({type:"quiz",score:s,total:questions.length});speakText("You scored "+s+" out of "+questions.length+". "+(s>=8?"Excellent work!":s>=5?"Good effort, keep reviewing.":"Watch the lesson again and try once more."));}
if(!questions)return(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><PixelCanvas pattern={unitPattern} color={accentColor} size={12} animated/><div style={{color:"#555",fontSize:13}}>Building your final quiz…</div></div>);
if(submitted){const pct=Math.round((score/questions.length)*100);return(<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:32}}><PixelCanvas pattern={unitPattern} color={accentColor} size={14} animated/><div style={{fontSize:46}}>{pct>=80?"🏆":pct>=50?"⭐":"📚"}</div><div style={{fontSize:22,color:"#fff",fontWeight:"bold"}}>Quiz Complete!</div><div style={{fontSize:20,color:accentColor,fontFamily:"monospace"}}>{score}/{questions.length} — {pct}%</div><div style={{fontSize:13,color:"#555",textAlign:"center",maxWidth:260}}>{pct>=80?"You've mastered this topic!":pct>=50?"Good work — re-watch the lesson and try again.":"Watch the lesson again and practice more."}</div><button onClick={onBack} style={{background:accentColor,border:"none",borderRadius:8,padding:"11px 24px",color:"#fff",fontSize:14,cursor:"pointer",marginTop:6}}>Back to Topics</button></div>);}
const answered=Object.keys(answers).length;
return(<div style={{flex:1,display:"flex",flexDirection:"column",padding:22,gap:14,overflowY:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:accentColor}}>Final Quiz</div><div style={{fontSize:16,color:"#fff",fontWeight:"bold",marginTop:2}}>{topic.title}</div></div><PixelCanvas pattern={unitPattern} color={accentColor} size={7} animated/></div>{questions.map((q,i)=>(<div key={i} style={{background:"#111118",border:"1px solid "+(answers[i]?accentColor+"55":"#1e1e2e"),borderRadius:9,padding:16}}><div style={{fontSize:14,color:"#ddd",marginBottom:11,lineHeight:1.5}}><span style={{color:accentColor,fontWeight:"bold",marginRight:7}}>{i+1}.</span>{q.question}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>{q.options?.map((opt,j)=>(<button key={j} onClick={()=>setAnswers(a=>({...a,[i]:opt}))} style={{background:answers[i]===opt?accentColor:"#0d0d18",border:"1px solid "+(answers[i]===opt?accentColor:"#2a2a3a"),borderRadius:5,padding:"8px 11px",color:answers[i]===opt?"#fff":"#666",cursor:"pointer",fontSize:13,textAlign:"left",transition:"all 0.15s"}}>{opt}</button>))}</div></div>))}<button onClick={submit} disabled={answered<questions.length} style={{background:answered>=questions.length?accentColor:"#1a1a1a",border:"none",borderRadius:8,padding:"13px",color:answered>=questions.length?"#fff":"#333",fontSize:14,fontWeight:"bold",cursor:answered>=questions.length?"pointer":"default",marginTop:4}}>Submit Quiz ({answered}/{questions.length} answered)</button></div>);}

function TopicView({topic,accentColor,unitName,unitPattern,onBack,onComplete,savedTopicProgress}){const saved=savedTopicProgress?.[topic.id]||{};const[phase,setPhase]=useState("intro");const[slides,setSlides]=useState([]);const[lessonWatched,setLessonWatched]=useState(saved.lessonDone||false);const[practiceScore,setPracticeScore]=useState(saved.practiceDone?(saved.practiceScore||0):null);const[generating,setGenerating]=useState(false);
useEffect(()=>{if(lessonWatched||practiceScore!==null){onComplete&&onComplete({type:"autosave",lessonWatched,practiceScore});}},[lessonWatched,practiceScore]);
async function startLesson(){setGenerating(true);try{const text=await callClaude([{role:"user",content:"Write a 5-slide math lesson on \""+topic.title+"\" covering: why it exists, how it works, a worked example, deeper understanding, real world and mistakes. Return ONLY a JSON array: [{\"title\":\"...\",\"content\":\"...\",\"hint\":\"...\",\"narration\":\"...\"}]. Narration: speak naturally 45-60 seconds, numbers in words, don't start with Welcome or Oh."}]);setSlides(JSON.parse(text.replace(/```json|```/g,"").trim()));}catch{setSlides([{title:"Introduction to "+topic.title,content:"This topic is fundamental to understanding mathematics. Every rule exists for a reason, and understanding those reasons leads to real mastery.",hint:"Ask yourself why each rule works, not just what it says.",narration:topic.title+" connects to almost everything else in mathematics. Try to understand why each step is necessary. That understanding will let you reconstruct the method even if you forget the exact procedure."},{title:"Core concept",content:"The central idea can be broken into specific components, each with a clear purpose. Learning each part helps you understand the whole structure.",hint:"Name each part and know what job it does.",narration:"Every piece has a specific job. Understanding each piece separately is much easier than trying to understand everything at once."},{title:"Worked example",content:"Applying the concept to a concrete problem shows how all the pieces work together. We go step by step, explaining every decision.",hint:"Predict each step before it is revealed.",narration:"Here is a full worked example. I will show you every step and explain why. Try to predict what comes next — that active engagement builds real understanding."},{title:"Patterns and connections",content:"Once you understand the mechanics, you can see patterns. Changing one part of a problem in a predictable way changes the answer predictably.",hint:"Change one number at a time and notice what happens.",narration:"Mathematics is full of patterns. When you change certain values, the answer changes in a predictable way. Spotting those patterns is what separates real understanding from just following steps."},{title:"Common mistakes and real life",content:"This concept appears in many real-world situations. Knowing the most frequent mistakes helps you avoid them. Most mistakes come from applying a procedure outside its valid conditions.",hint:"Check: am I using this rule in the right situation?",narration:"The mistake I see most often comes from applying the right procedure in slightly the wrong situation. If you know what the mistake looks like in advance, you will catch yourself before you make it."}]);}setGenerating(false);setPhase("playing");}
if(generating)return(<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:20}}><PixelCanvas pattern={unitPattern} color={accentColor} size={12} animated/><div style={{color:"#555",fontSize:13}}>Ms. Maya is preparing your lesson…</div></div>);
if(phase==="playing")return <VideoPlayer slides={slides} accentColor={accentColor} unitName={unitName} unitPattern={unitPattern} topicId={topic.id} onFinish={async()=>{setLessonWatched(true);setPhase("intro");if(onComplete)onComplete({type:"lesson"});}}/>;
if(phase==="practice")return <PracticeMode topic={topic} accentColor={accentColor} unitPattern={unitPattern} onDone={async s=>{setPracticeScore(s);setPhase("quiz");if(onComplete)onComplete({type:"practice",score:s});}}/>;
if(phase==="quiz")return <FinalQuiz topic={topic} unitPattern={unitPattern} accentColor={accentColor} onBack={onBack} onComplete={onComplete}/>;
return(<div style={{flex:1,overflowY:"auto",padding:26}}><button onClick={()=>{onBack&&onBack();}} style={{background:"transparent",border:"none",color:"#444",cursor:"pointer",fontSize:13,marginBottom:20,padding:0}}>← Back</button><div style={{display:"flex",alignItems:"center",gap:14,marginBottom:22}}><PixelCanvas pattern={unitPattern} color={accentColor} size={9}/><div><div style={{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:accentColor,marginBottom:3}}>{topic.grade}</div><div style={{fontSize:22,fontWeight:"bold",color:"#fff"}}>{topic.title}</div><div style={{fontSize:12,color:"#555",marginTop:2}}>{topic.desc}</div></div></div>{[{step:1,label:"Watch Lesson",sub:"5 slides · Ms. Maya teaches with animations and voice",icon:"▶",unlocked:true,done:lessonWatched,onClick:startLesson},{step:2,label:"Practice Problems",sub:"6 problems · voice feedback"+(practiceScore!==null?" · Score: "+practiceScore+"/6":""),icon:lessonWatched?"✏️":"🔒",unlocked:lessonWatched,done:practiceScore!==null,onClick:()=>setPhase("practice")},{step:3,label:"Final Quiz",sub:"10 multiple choice · unlocks after practice",icon:practiceScore!==null?"🏆":"🔒",unlocked:practiceScore!==null,done:false,onClick:()=>setPhase("quiz")}].map(({step,label,sub,icon,unlocked,done,onClick})=>(<div key={step} onClick={unlocked?onClick:undefined} style={{background:"#111118",border:"2px solid "+(unlocked?accentColor+"44":"#111"),borderRadius:10,padding:"18px 22px",marginBottom:11,cursor:unlocked?"pointer":"not-allowed",opacity:unlocked?1:0.35,transition:"border-color 0.2s"}} onMouseEnter={e=>unlocked&&(e.currentTarget.style.borderColor=accentColor)} onMouseLeave={e=>{e.currentTarget.style.borderColor=unlocked?accentColor+"44":"#111";}}><div style={{display:"flex",alignItems:"center",gap:12}}><div style={{width:40,height:40,borderRadius:"50%",background:unlocked?accentColor:"#222",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{icon}</div><div><div style={{fontSize:14,color:unlocked?"#fff":"#444",fontWeight:"bold"}}>{step}. {label}</div><div style={{fontSize:11,color:"#444",marginTop:2}}>{sub}</div></div>{done&&<div style={{marginLeft:"auto",color:"#4ade4a",fontSize:16}}>✓</div>}</div></div>))}</div>);}

export default function App(){const[selectedTopic,setSelectedTopic]=useState(null);const[selectedUnit,setSelectedUnit]=useState(null);const[sidebarOpen,setSidebarOpen]=useState(true);const[progress,setProgress]=useState(DEFAULT_PROGRESS);const[showDashboard,setShowDashboard]=useState(false);const[newBadges,setNewBadges]=useState([]);const progressRef=useRef(DEFAULT_PROGRESS);const unit=CURRICULUM.find(u=>u.unit===selectedUnit);
useEffect(()=>{loadProgress().then(p=>{progressRef.current=p;setProgress(p);});const h=()=>saveProgress(progressRef.current);document.addEventListener("visibilitychange",h);window.addEventListener("beforeunload",h);return()=>{document.removeEventListener("visibilitychange",h);window.removeEventListener("beforeunload",h);};},[]);
async function handleComplete(event){const p={...progressRef.current};const topicId=selectedTopic?.id;const unitName=selectedUnit;if(event.type==="autosave"){if(event.lessonWatched&&topicId)p.topicProgress={...p.topicProgress,[topicId]:{...p.topicProgress?.[topicId],lessonDone:true}};if(event.practiceScore!==null&&topicId)p.topicProgress={...p.topicProgress,[topicId]:{...p.topicProgress?.[topicId],practiceDone:true,practiceScore:event.practiceScore}};progressRef.current=p;saveProgress(p);return;}if(event.type==="lesson"){p.lessonsWatched=(p.lessonsWatched||0)+1;if(topicId)p.topicProgress={...p.topicProgress,[topicId]:{...p.topicProgress?.[topicId],lessonDone:true}};}if(event.type==="practice"){p.practicesDone=(p.practicesDone||0)+1;if(event.score>=5)p.highPractice=(p.highPractice||0)+1;if(topicId)p.topicProgress={...p.topicProgress,[topicId]:{...p.topicProgress?.[topicId],practiceDone:true,practiceScore:event.score}};}if(event.type==="quiz"){p.quizzesDone=(p.quizzesDone||0)+1;if(event.score===event.total)p.perfectQuizzes=(p.perfectQuizzes||0)+1;if(topicId){p.quizScores={...p.quizScores,[topicId]:event.score};p.topicProgress={...p.topicProgress,[topicId]:{...p.topicProgress?.[topicId],quizDone:true,quizScore:event.score}};const already=p.completedTopics||[];if(!already.includes(topicId)){p.completedTopics=[...already,topicId];p.topicStreak=(p.topicStreak||0)+1;}const unitObj=CURRICULUM.find(u=>u.unit===unitName);if(unitObj&&unitObj.topics.every(t=>p.completedTopics.includes(t.id)))p.unitsDone={...p.unitsDone,[unitName]:true};}}const{newBadges:earned,earnedBadges}=checkNewBadges(p);p.earnedBadges=earnedBadges;progressRef.current=p;setProgress({...p});saveProgress(p);if(earned.length>0)setNewBadges(earned);}
const totalTopics=CURRICULUM.reduce((s,u)=>s+u.topics.length,0);const donePct=Math.round(((progress.completedTopics||[]).length/totalTopics)*100);
if(selectedTopic&&unit)return(<div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#0d0d14",fontFamily:"'DM Sans',system-ui,sans-serif"}}><div style={{padding:"9px 16px",borderBottom:"1px solid #111",display:"flex",alignItems:"center",gap:9}}><button onClick={()=>{saveProgress(progressRef.current);setSelectedTopic(null);}} style={{background:"transparent",border:"none",color:"#444",cursor:"pointer",fontSize:16}}>←</button><span style={{fontSize:11,color:"#444"}}>{selectedUnit}</span><span style={{color:"#222"}}>/</span><span style={{fontSize:11,color:"#888"}}>{selectedTopic.title}</span><div style={{flex:1}}/><button onClick={()=>setShowDashboard(true)} style={{background:"transparent",border:"1px solid #222",borderRadius:6,padding:"4px 10px",color:"#666",cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",gap:5}}><span>🏅</span><span>{(progress.earnedBadges||[]).length}</span></button></div><TopicView topic={selectedTopic} accentColor={unit.color} unitName={unit.unit} unitPattern={unit.pixelArt} onBack={()=>{saveProgress(progressRef.current);setSelectedTopic(null);}} onComplete={handleComplete} savedTopicProgress={progress.topicProgress}/>{showDashboard&&<ProgressDashboard progress={progress} onClose={()=>setShowDashboard(false)}/>}{newBadges.length>0&&<BadgeToast badges={newBadges} onDone={()=>setNewBadges([])}/>}</div>);
return(<div style={{height:"100vh",display:"flex",fontFamily:"'DM Sans',system-ui,sans-serif",background:"#0d0d14",overflow:"hidden"}}><div style={{width:sidebarOpen?248:52,background:"#09090f",borderRight:"1px solid #111",display:"flex",flexDirection:"column",flexShrink:0,transition:"width 0.2s",overflow:"hidden"}}><div style={{padding:sidebarOpen?"16px 16px 6px":"16px 8px 6px",display:"flex",alignItems:"center",justifyContent:sidebarOpen?"space-between":"center"}}>{sidebarOpen&&<div style={{fontSize:13,fontWeight:"bold",color:"#fff"}}>MathAcademy</div>}<button onClick={()=>setSidebarOpen(o=>!o)} style={{background:"transparent",border:"none",color:"#444",cursor:"pointer",fontSize:14,padding:3}}>{sidebarOpen?"←":"→"}</button></div><div style={{flex:1,overflowY:"auto",padding:"4px 0"}}>{CURRICULUM.map(u=>(<div key={u.unit}><div style={{padding:sidebarOpen?"9px 16px 2px":"9px 6px 2px",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:u.color,display:"flex",alignItems:"center",gap:5}}>{sidebarOpen?<><span>{u.icon}</span><span>{u.unit}</span></>:<PixelCanvas pattern={u.pixelArt} color={u.color} size={4}/>}</div>{u.topics.map(t=>{const complete=(progress.completedTopics||[]).includes(t.id);return(<button key={t.id} onClick={()=>{saveProgress(progressRef.current);setSelectedTopic(t);setSelectedUnit(u.unit);}} style={{width:"100%",background:"transparent",border:"none",padding:sidebarOpen?"6px 16px 6px 26px":"6px 6px",textAlign:"left",cursor:"pointer",color:complete?"#4ade4a":"#555",fontSize:11,display:"flex",alignItems:"center",gap:5,transition:"color 0.15s"}} onMouseEnter={e=>e.currentTarget.style.color=complete?"#7aee7a":"#ddd"} onMouseLeave={e=>{e.currentTarget.style.color=complete?"#4ade4a":"#555";}}>{sidebarOpen?<><span style={{opacity:complete?1:0,fontSize:9}}>✓</span><span>{t.title}</span></>:<span>·</span>}</button>);})}</div>))}</div>{sidebarOpen&&(<div style={{padding:"10px 14px",borderTop:"1px solid #111"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:10,color:"#444"}}>Progress</span><span style={{fontSize:10,color:"#888"}}>{donePct}%</span></div><div style={{height:4,background:"#1a1a2e",borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",background:"linear-gradient(90deg,#f72585,#7b2d8b)",width:donePct+"%",borderRadius:2,transition:"width 0.4s"}}/></div></div>)}</div><div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}><div style={{padding:"12px 20px",borderBottom:"1px solid #111",display:"flex",alignItems:"center",justifyContent:"flex-end",gap:10}}><button onClick={()=>setShowDashboard(true)} style={{background:"#111118",border:"1px solid #1e1e2e",borderRadius:8,padding:"7px 14px",color:"#aaa",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",gap:7}}><span>🏅</span><span>{(progress.earnedBadges||[]).length}/{BADGES.length} badges</span><span style={{color:"#555"}}>·</span><span>📊</span><span>Progress</span></button></div><div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20,padding:40}}><div style={{display:"flex",gap:12}}>{CURRICULUM.map(u=><PixelCanvas key={u.unit} pattern={u.pixelArt} color={u.color} size={8} animated/>)}</div><div style={{fontSize:24,fontWeight:"bold",color:"#fff"}}>MathAcademy</div><div style={{background:"#111118",border:"1px solid #1e1e2e",borderRadius:12,padding:"14px 24px",display:"flex",alignItems:"center",gap:16}}><div style={{position:"relative",width:52,height:52}}><svg viewBox="0 0 52 52" style={{transform:"rotate(-90deg)"}}><circle cx="26" cy="26" r="22" fill="none" stroke="#1a1a2e" strokeWidth="5"/><circle cx="26" cy="26" r="22" fill="none" stroke="url(#grad)" strokeWidth="5" strokeLinecap="round" strokeDasharray={String(2*Math.PI*22)} strokeDashoffset={String(2*Math.PI*22*(1-donePct/100))} style={{transition:"stroke-dashoffset 0.5s ease"}}/><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#f72585"/><stop offset="100%" stopColor="#7b2d8b"/></linearGradient></defs></svg><div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:"bold",color:"#fff"}}>{donePct}%</div></div><div><div style={{fontSize:13,color:"#fff",fontWeight:"bold"}}>{(progress.completedTopics||[]).length} of {totalTopics} topics done</div><div style={{fontSize:11,color:"#555",marginTop:3}}>{(progress.earnedBadges||[]).length} badge{(progress.earnedBadges||[]).length!==1?"s":""} earned · {progress.quizzesDone||0} quiz{(progress.quizzesDone||0)!==1?"zes":""} passed</div></div></div><div style={{fontSize:13,color:"#444",textAlign:"center",maxWidth:280,lineHeight:1.8}}>Pick a topic from the sidebar.<br/>Watch · Practice · Quiz.</div></div></div>{showDashboard&&<ProgressDashboard progress={progress} onClose={()=>setShowDashboard(false)}/>}{newBadges.length>0&&<BadgeToast badges={newBadges} onDone={()=>setNewBadges([])}/>}</div>);}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
